<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio — premium hero section." />
    <title>Alex Rivera — Portfolio</title>

    <!-- Fonts: modern, clean sans-serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Animated background layers -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <canvas id="particles" class="bg-particles" aria-hidden="true"></canvas>

    <header class="site-header">
        <a href="#" class="logo">AR<span>.</span></a>
        <nav class="nav">
            <a href="#work">Work</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero__inner">
                <p class="hero__eyebrow">
                    <span class="hero__dot"></span>
                    Available for new projects
                </p>

                <h1 class="hero__name">
                    Alex Rivera
                </h1>

                <h2 class="hero__title">
                    Product Designer <span class="amp">&amp;</span> Frontend Engineer
                </h2>

                <p class="hero__tagline">
                    I craft fast, elegant interfaces where thoughtful design
                    meets clean, resilient code.
                </p>

                <div class="hero__cta">
                    <a href="#work" class="btn btn--primary">
                        View my work
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <a href="#contact" class="btn btn--ghost">
                        Get in touch
                    </a>
                </div>
            </div>

            <div class="hero__scroll" aria-hidden="true">
                <span>Scroll</span>
                <div class="hero__scroll-line"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
